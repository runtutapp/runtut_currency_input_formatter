name: runtut_currency_input_formatter
description: 'A lightweight Flutter package for formatting currency input fields. Pass a locale and an ISO 4217 currency code — separators and decimal digits are derived automatically.'
version: 0.1.0
homepage: https://github.com/runtutapp/runtut_currency_input_formatter

environment:
  sdk: ^3.11.4
  flutter: '>=1.17.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

linter:
  rules:
    - public_member_api_docs: true
